# Kiwix Search Configuration
# This file contains configuration for the kiwix_search.py script

# The URL of the Kiwix server
# Default: http://192.168.3.5:8081
kiwix_server_url: "http://192.168.3.5:8081"

# The default book to search when no specific book is provided
# Default: wikipedia_en_all_maxi_2026-02
default_book: "wikipedia_en_all_maxi_2026-02"

# List of all available books to search
# Each book is identified by its unique name
